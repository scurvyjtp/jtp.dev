name: Mirror to Github

on:
  push:
    branches:
      - "*"
    tags:
     - "*"
  workflow_dispatch:

jobs:
  mirror:
    runs-on: codeberg-tiny
    steps:
      - name: Mirror Repository
        env:
          GITHUB_TOKEN: ${{ secrets.JTP_GH_MIRROR }}
        run: |
          set -eu

          git clone --mirror \
          "http://codeberg.org/${{ forge.repository }}.git" \
          mirror.git

          cd mirror.git

          git push --mirror \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/scurvyjtp/jtp.dev.git"
